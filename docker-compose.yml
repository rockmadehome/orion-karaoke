version: '3.8'

services:
  # Main API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/orion-karaoke.db
      - YOUTUBE_DL_CONFIG=/app/config/yt-dlp.conf
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./output:/app/output
      - ./downloads:/app/downloads
    depends_on:
      - redis
    networks:
      - orion-network
    restart: unless-stopped

  # Redis for queue and sessions
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orion-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Worker for video processing
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - api
      - redis
    volumes:
      - ./downloads:/app/downloads
      - ./output:/app/output
      - ./temp:/app/temp
    networks:
      - orion-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - orion-network
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:3000

  # Google Cast Server
  cast-server:
    build:
      context: .
      dockerfile: Dockerfile.cast-server
    ports:
      - "8000:8000"
      - "8001:8001" # Web interface
    depends_on:
      - api
    volumes:
      - ./cast:/app/cast
      - ./output:/app/output
    networks:
      - orion-network
    restart: unless-stopped
    environment:
      - CAST_API_URL=http://api:3000

  # Cast Server Screen (HDMI output)
  cast-screen:
    build:
      context: .
      dockerfile: Dockerfile.cast-screen
    depends_on:
      - cast-server
    volumes:
      - ./cast:/app/cast
    networks:
      - orion-network
    restart: unless-stopped
    environment:
      - CAST_SERVER_URL=http://cast-server:8000
    # This service needs access to the host's display for HDMI output
    # In production, this would run on a dedicated device with HDMI output

  # PostgreSQL (optional)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=orion_karaoke
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - orion-network
    restart: unless-stopped
    profiles:
      - postgres

  # MongoDB (optional)
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin_password
      - MONGO_INITDB_DATABASE=orion_karaoke
    volumes:
      - mongodb_data:/data/db
    networks:
      - orion-network
    restart: unless-stopped
    profiles:
      - mongodb

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
      - frontend
      - cast-server
    networks:
      - orion-network
    restart: unless-stopped

  # Monitoring and logging
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - orion-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - orion-network
    restart: unless-stopped

  # File cleanup service (cron job)
  cleanup:
    build:
      context: .
      dockerfile: Dockerfile.cleanup
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./downloads:/app/downloads
      - ./temp:/app/temp
    networks:
      - orion-network
    restart: "no"
    # This runs as a cron job, not a persistent service

volumes:
  redis_data:
  postgres_data:
  mongodb_data:
  prometheus_data:
  grafana_data:

networks:
  orion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16